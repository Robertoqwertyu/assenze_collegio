<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Assenze Collegio</title>
  <meta name="description" content="Conteggio delle assenze del collegio, anche offline">
  <meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a1220" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Assenze">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="views">
      <section id="v-calendario" class="view" aria-label="Calendario"></section>
      <section id="v-riepilogo" class="view" aria-label="Riepilogo" hidden></section>
      <section id="v-mesi" class="view" aria-label="Mesi" hidden></section>
      <section id="v-elenco" class="view" aria-label="Elenco" hidden></section>
      <section id="v-impostazioni" class="view" aria-label="Impostazioni" hidden></section>
    </main>
    <nav id="tabs" aria-label="Sezioni"></nav>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="dlg-periodo" aria-labelledby="dlg-periodo-t"></dialog>
  <dialog id="dlg-codice" aria-labelledby="dlg-codice-t"></dialog>

  <section id="report" aria-hidden="true"></section>

  <noscript>Questa app richiede JavaScript.</noscript>
  <script src="engine.js"></script>
  <script src="app.js"></script>   <!-- xlsx.js si carica da solo alla prima esportazione/importazione Excel -->

  <!-- =====================================================================================
       FIREBASE: accesso con Google (Authentication) + database Cloud Firestore.
       L'SDK viene caricato come moduli dalla CDN ufficiale Google (nessun bundler) e il
       Service Worker lo tiene in cache: offline l'app funziona comunque.
       ===================================================================================== -->
  <script type="module">
    /* ╔══════════════════════════════════════════════════════════════════════════════════╗
       ║  1) CONFIGURAZIONE  ->  INCOLLA QUI LE CHIAVI DEL TUO PROGETTO FIREBASE           ║
       ║  Console Firebase › Impostazioni progetto › Le tue app › App web › "Config"       ║
       ║  Sostituisci tutto il blocco qui sotto con quello copiato dalla console.           ║
       ║  Le chiavi NON sono segrete: la sicurezza dei dati sono le Security Rules          ║
       ║  (file firestore.rules). Finché restano "INCOLLA_QUI" l'app funziona solo in locale.║
       ╚══════════════════════════════════════════════════════════════════════════════════╝ */
    const firebaseConfig = {
  apiKey: "AIzaSyDCvxkf4V9Bd3rhg6GU881M9h1QdmrLt7s",
  authDomain: "app-assenze.firebaseapp.com",
  projectId: "app-assenze",
  storageBucket: "app-assenze.firebasestorage.app",
  messagingSenderId: "857446033411",
  appId: "1:857446033411:web:085b3b4eec9ba261018636"
};

    /* 2) Versione dell'SDK Firebase (CDN ufficiale Google). Per aggiornarla cambia solo questo numero. */
    const SDK = "https://www.gstatic.com/firebasejs/10.14.1/";

    /* ------------------------------------------------------------------------------------
       3) Adattatore: espone all'app (window.FB) solo ciò che serve. Struttura dei dati:
            users/{uid}/days/{AAAA-MM-GG}   ->  { s: 'A' | 'G' | '', t: ora della modifica (ms) }
            users/{uid}/meta/settings       ->  { updatedAt, settings, chiusure, festivita }
          Ogni utente vede e scrive solo sotto il proprio uid (vedi firestore.rules).
       ------------------------------------------------------------------------------------ */
    const configured = ["apiKey", "projectId", "appId"].every((k) => firebaseConfig[k] && !/INCOLLA/i.test(firebaseConfig[k]));
    const FB = (window.FB = { configured, ready: false, failed: "", persistence: "" });

    if (configured) {
      try {
        /* L'SDK (circa mezzo MB) si carica a prima schermata disegnata e a browser libero, non durante l'avvio:
           l'app è subito utilizzabile con i dati locali; l'accesso Google e la sincronizzazione partono subito dopo. */
        await new Promise((go) => {
          const idle = () => ("requestIdleCallback" in window ? requestIdleCallback(() => go(), { timeout: 1500 }) : setTimeout(go, 300));
          document.readyState === "complete" ? idle() : window.addEventListener("load", idle, { once: true });
        });
        const [appM, authM, fsM] = await Promise.all([
          import(SDK + "firebase-app.js"),
          import(SDK + "firebase-auth.js"),
          import(SDK + "firebase-firestore.js"),
        ]);
        const app = appM.initializeApp(firebaseConfig);
        const auth = authM.getAuth(app);

        /* Firestore con cache offline persistente (IndexedDB): le modifiche fatte senza rete restano in coda
           e partono da sole quando la rete torna. Equivale al vecchio enableIndexedDbPersistence() dell'SDK v10. */
        let db;
        try {
          db = fsM.initializeFirestore(app, {
            localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }),
            experimentalAutoDetectLongPolling: true,   // più affidabile dietro proxy e reti difficili
          });
          FB.persistence = "indexeddb";
        } catch (e) {
          db = fsM.getFirestore(app);                  // se IndexedDB non è disponibile: cache in memoria
          FB.persistence = "memory";
        }

        /* Ritorno dall'accesso con redirect (ripiego se il popup è bloccato). Alcuni browser bloccano lo storage di terze parti
           e il ritorno da Google si perde in silenzio: lo segnaliamo all'app, che avvisa l'utente invece di non fare nulla. */
        const REDIR = "assenze-collegio:redir";
        FB.redirectCheck = authM.getRedirectResult(auth).then((r) => {
          let t = 0; try { t = Number(localStorage.getItem(REDIR)) || 0; localStorage.removeItem(REDIR); } catch (e) { /* ignora */ }
          return !r && t && Date.now() - t < 15 * 60 * 1000 ? { lost: true } : null;
        }).catch((e) => {
          try { localStorage.removeItem(REDIR); } catch (x) { /* ignora */ }
          return { error: (e && e.code) || "errore" };
        });

        FB.onAuth = (cb) => authM.onAuthStateChanged(auth, cb);   // scatta subito con l'utente salvato, anche offline
        FB.signOut = () => authM.signOut(auth);
        FB.signIn = async () => {
          const provider = new authM.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });
          try {
            await authM.signInWithPopup(auth, provider);
          } catch (e) {
            if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) {
              try { localStorage.setItem(REDIR, String(Date.now())); } catch (x) { /* ignora */ }
              await authM.signInWithRedirect(auth, provider);   // ripiego se il popup non è possibile
              return;
            }
            throw e;
          }
        };

        FB.subscribe = (uid, h) => {
          const opt = { includeMetadataChanges: true };
          const stopDays = fsM.onSnapshot(fsM.collection(db, "users", uid, "days"), opt, (snap) => {
            const map = {}; let pending = 0;
            snap.forEach((d) => { map[d.id] = d.data(); if (d.metadata.hasPendingWrites) pending++; });
            h.days(map, { fromCache: snap.metadata.fromCache, pending });
          }, (err) => h.error(err));
          const stopSet = fsM.onSnapshot(fsM.doc(db, "users", uid, "meta", "settings"), opt, (snap) => {
            h.settings(snap.exists() ? snap.data() : null, { fromCache: snap.metadata.fromCache, pending: snap.metadata.hasPendingWrites });
          }, (err) => h.error(err));
          return () => { stopDays(); stopSet(); };
        };
        FB.writeDay = (uid, date, mark) => fsM.setDoc(fsM.doc(db, "users", uid, "days", date), { s: mark.s, t: mark.t });
        FB.writeSettings = (uid, data) => fsM.setDoc(fsM.doc(db, "users", uid, "meta", "settings"), data);
        /* "Esci e cancella i dati": svuota la cache offline di Firestore (per dispositivi condivisi) */
        FB.wipeCache = async () => { await fsM.terminate(db); await fsM.clearIndexedDbPersistence(db); };
      } catch (e) {
        FB.failed = String((e && e.message) || e);   // es. prima apertura senza rete: l'app resta utilizzabile in locale
      }
    }
    FB.ready = true;
    window.dispatchEvent(new Event("fb-ready"));
  </script>
</body>
</html>
